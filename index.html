<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0e0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Cuisine">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>La Cuisine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --ink:#0f0e0c;--ink2:#1a1814;--ink3:#252320;
  --gold:#c8922a;--gold2:#e8b84b;--gold-dim:rgba(200,146,42,0.15);
  --cream:#f5f0e6;--cream2:#e8e0d0;--muted:#7a7568;--muted2:#5a544a;
  --border:rgba(200,146,42,0.18);--border2:rgba(200,146,42,0.35);
  --red-bg:rgba(192,57,43,0.12);--green-bg:rgba(45,106,79,0.12);
}
html,body{height:100%;overflow:hidden;background:var(--ink);font-family:'Jost',sans-serif;color:var(--cream);}
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--ink);overflow:hidden;}
.app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:0.025;}
.header{flex-shrink:0;padding:calc(env(safe-area-inset-top,0px)+20px) 24px 0;background:var(--ink);}
.header-rule{width:100%;height:0.5px;background:var(--border);margin-top:16px;}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;letter-spacing:.12em;color:var(--cream);line-height:1;}
.brand-star{color:var(--gold);font-size:14px;letter-spacing:.3em;}
.brand-sub{font-size:10px;font-weight:300;color:var(--muted);letter-spacing:.25em;text-transform:uppercase;}
.tabs{flex-shrink:0;display:flex;padding:14px 16px 12px;background:var(--ink);border-bottom:0.5px solid var(--border);}
.tab{flex:1;padding:8px 0;background:none;border:none;font-family:'Jost',sans-serif;font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:color .2s;display:flex;align-items:center;justify-content:center;gap:5px;position:relative;}
.tab::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:0;height:1px;background:var(--gold);transition:width .3s cubic-bezier(.4,0,.2,1);}
.tab.active{color:var(--gold);}
.tab.active::after{width:80%;}
.tab i{font-size:13px;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.pane{display:none;padding:20px 24px 120px;}
.pane.active{display:block;animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-label{font-size:9px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;margin-top:4px;}

/* SCAN */
.camera-box{border:1px solid var(--border);border-radius:4px;padding:44px 20px;text-align:center;cursor:pointer;background:var(--ink2);margin-bottom:20px;position:relative;overflow:hidden;}
.camera-box::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(200,146,42,0.06),transparent 70%);pointer-events:none;}
.camera-box:active{border-color:var(--gold2);}
.cam-icon{font-size:36px;color:var(--gold);display:block;margin-bottom:14px;opacity:.7;}
.cam-label{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--cream);letter-spacing:.06em;}
.cam-sub{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.05em;line-height:1.5;}
#fileInput{display:none;}
.preview-img{width:100%;border-radius:4px;display:none;margin-bottom:16px;object-fit:cover;max-height:260px;border:0.5px solid var(--border);}
.retake-btn{width:100%;padding:12px;background:transparent;color:var(--muted);border:0.5px solid rgba(255,255,255,0.1);border-radius:4px;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.1em;cursor:pointer;margin-bottom:20px;display:none;}
.status-bar{padding:12px 16px;border-radius:4px;font-size:12px;display:none;align-items:center;gap:10px;margin-bottom:16px;}
.status-bar.loading{background:var(--ink3);color:var(--muted);display:flex;border:0.5px solid var(--border);}
.status-bar.error{background:var(--red-bg);color:#e57368;display:flex;border:0.5px solid rgba(192,57,43,0.3);}
.ing-wrap{margin-bottom:20px;display:none;}
.ing-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.ing-tag{font-size:11px;padding:5px 12px;background:var(--ink3);border:0.5px solid var(--border);border-radius:2px;color:var(--cream2);display:flex;align-items:center;gap:6px;}
.ing-tag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0;}
.ing-add{display:flex;gap:8px;}
.ing-add input{flex:1;padding:11px 14px;border:0.5px solid var(--border);border-radius:4px;font-family:'Jost',sans-serif;font-size:13px;background:var(--ink2);color:var(--cream);outline:none;}
.ing-add input::placeholder{color:var(--muted2);}
.ing-add input:focus{border-color:var(--border2);}
.ing-add button{padding:11px 18px;background:var(--gold);color:var(--ink);border:none;border-radius:4px;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;cursor:pointer;white-space:nowrap;}
.btn-main{width:100%;padding:17px;background:var(--gold);color:var(--ink);border:none;border-radius:4px;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none;}
.btn-main:active{opacity:.8;}
.btn-main.show{display:flex;}

/* AI RESULTS */
.recipe-cards{display:flex;flex-direction:column;gap:14px;}
.recipe-card{background:var(--ink2);border:0.5px solid var(--border);border-radius:4px;overflow:hidden;}
.recipe-card-header{padding:18px 18px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer;}
.recipe-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--cream);margin-bottom:8px;line-height:1.2;font-style:italic;}
.recipe-meta{display:flex;gap:14px;}
.recipe-badge{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;letter-spacing:.06em;}
.recipe-badge i{font-size:12px;}
.match-pill{font-size:9px;font-weight:500;padding:4px 10px;border-radius:2px;white-space:nowrap;flex-shrink:0;letter-spacing:.1em;text-transform:uppercase;}
.match-high{background:var(--green-bg);color:#6dbf9c;border:0.5px solid rgba(45,106,79,0.4);}
.match-mid{background:rgba(200,146,42,0.1);color:var(--gold2);border:0.5px solid var(--border);}
.recipe-body{display:none;border-top:0.5px solid var(--border);padding:18px;}
.recipe-body.open{display:block;}
.recipe-steps{padding-left:0;margin-bottom:14px;list-style:none;counter-reset:steps;}
.recipe-steps li{font-size:13px;color:var(--cream2);margin-bottom:10px;line-height:1.6;padding-left:24px;position:relative;counter-increment:steps;}
.recipe-steps li::before{content:counter(steps);position:absolute;left:0;top:2px;font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--gold);font-weight:600;}
.missing-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.recipe-missing{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.missing-tag{font-size:11px;padding:4px 10px;background:var(--red-bg);border-radius:2px;color:#e57368;}
.save-btn{width:100%;padding:13px;background:transparent;color:var(--gold);border:0.5px solid var(--border2);border-radius:4px;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.save-btn:active{background:var(--gold-dim);}
.save-btn.saved{background:var(--green-bg);color:#6dbf9c;border-color:rgba(45,106,79,0.4);}

/* RÉPERTOIRE */
.saved-list{display:flex;flex-direction:column;gap:12px;}
.saved-item{background:var(--ink2);border:0.5px solid var(--border);border-radius:4px;overflow:hidden;transition:border-color .2s;}
.saved-item.open-item{border-color:var(--border2);}
.saved-item-header{padding:16px 16px 14px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
.saved-item-header:active{background:rgba(200,146,42,0.04);}
.saved-icon-wrap{flex-shrink:0;margin-top:3px;}
.saved-icon-wrap i{font-size:16px;color:var(--gold);opacity:.7;}
.saved-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:400;font-style:italic;color:var(--cream);line-height:1.2;margin-bottom:5px;}
.saved-meta-row{font-size:10px;color:var(--muted);letter-spacing:.08em;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.saved-meta-dot{color:var(--border2);}
.saved-del{margin-left:auto;background:none;border:none;color:var(--muted2);font-size:16px;cursor:pointer;padding:4px;flex-shrink:0;opacity:.5;}
.saved-detail{display:none;border-top:0.5px solid var(--border);padding:0 18px 20px;background:rgba(0,0,0,0.15);}
.saved-detail.open{display:block;}
.scaler{display:flex;align-items:center;gap:0;margin:16px 0 20px;background:var(--ink3);border:0.5px solid var(--border);border-radius:4px;overflow:hidden;}
.scaler-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);padding:0 14px;flex:1;}
.scaler-val{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--cream);min-width:36px;text-align:center;}
.scaler-unit{font-size:10px;color:var(--muted);letter-spacing:.1em;padding-right:4px;}
.scaler-btn{width:44px;height:44px;background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.scaler-btn:active{background:var(--gold-dim);}
.detail-section{margin-bottom:20px;}
.detail-label{font-size:9px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:8px;padding-top:18px;}
.detail-label::after{content:'';flex:1;height:0.5px;background:var(--border);}
.detail-ing{font-size:13px;color:var(--cream2);margin-bottom:6px;padding-left:14px;position:relative;line-height:1.5;}
.detail-ing::before{content:"·";position:absolute;left:0;color:var(--gold);}
.detail-ing .qty{color:var(--gold2);font-weight:500;}
.detail-step{font-size:13px;color:var(--cream2);margin-bottom:10px;padding-left:26px;position:relative;line-height:1.6;}
.detail-step-num{position:absolute;left:0;font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--gold);font-weight:600;top:0;}
.detail-notes{font-size:12px;color:var(--muted);border-left:2px solid var(--gold);padding:10px 14px;line-height:1.6;font-style:italic;background:var(--gold-dim);border-radius:0 4px 4px 0;}
.cat-pill{display:inline-block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);border:0.5px solid var(--border);padding:3px 10px;border-radius:2px;margin-top:16px;margin-bottom:4px;}

/* INSPIRATION */
.insp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.insp-card{background:var(--ink2);border:0.5px solid var(--border);border-radius:4px;padding:16px 14px;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden;}
.insp-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(200,146,42,0.05),transparent 70%);pointer-events:none;}
.insp-card:active{border-color:var(--border2);background:rgba(200,146,42,0.04);}
.insp-flag{font-size:24px;display:block;margin-bottom:10px;}
.insp-name{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:400;font-style:italic;color:var(--cream);line-height:1.2;margin-bottom:6px;}
.insp-origin{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.insp-tags{display:flex;flex-wrap:wrap;gap:4px;}
.insp-tag{font-size:9px;padding:2px 7px;background:rgba(200,146,42,0.08);border:0.5px solid var(--border);border-radius:2px;color:var(--muted);letter-spacing:.05em;}
.insp-diff{position:absolute;top:10px;right:10px;font-size:9px;letter-spacing:.1em;}
.diff-1{color:#6dbf9c;}
.diff-2{color:var(--gold2);}
.diff-3{color:#e57368;}

/* INSPIRATION RECIPE OVERLAY */
.overlay{position:fixed;inset:0;z-index:200;background:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;max-width:480px;margin:0 auto;}
.overlay.open{display:block;animation:fadeUp .2s ease;}
.overlay-header{padding:calc(env(safe-area-inset-top,0px)+16px) 20px 16px;display:flex;align-items:center;gap:16px;border-bottom:0.5px solid var(--border);background:var(--ink);position:sticky;top:0;z-index:10;}
.overlay-back{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:0;display:flex;align-items:center;}
.overlay-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--cream);font-weight:400;}
.overlay-body{padding:20px 24px 100px;}
.overlay-loading{text-align:center;padding:80px 20px;}
.overlay-loading p{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;color:var(--muted);margin-top:20px;}

.empty-state{text-align:center;padding:70px 20px;}
.empty-state i{font-size:36px;color:var(--border2);display:block;margin-bottom:16px;}
.empty-state p{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;font-style:italic;color:var(--muted);line-height:1.6;}
.spinner{display:inline-block;width:16px;height:16px;border:1.5px solid rgba(200,146,42,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
.spinner-lg{width:36px;height:36px;border-width:2px;}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-safe{height:env(safe-area-inset-bottom,0px);background:var(--ink);flex-shrink:0;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand"><span class="brand-name">La Cuisine</span><span class="brand-star">✦ ✦ ✦</span></div>
    <div class="brand-sub">Pour les esprits exigeants</div>
    <div class="header-rule"></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('scan')" id="tab-scan"><i class="ti ti-camera"></i> Scanner</button>
    <button class="tab" onclick="showTab('recipes')" id="tab-recipes"><i class="ti ti-sparkles"></i> Résultats</button>
    <button class="tab" onclick="showTab('saved')" id="tab-saved"><i class="ti ti-book"></i> Répertoire</button>
    <button class="tab" onclick="showTab('insp')" id="tab-insp"><i class="ti ti-star"></i> Inspiration</button>
  </div>
  <div class="content">

    <!-- SCAN -->
    <div class="pane active" id="pane-scan">
      <div class="camera-box" id="cameraBox" onclick="document.getElementById('fileInput').click()">
        <i class="ti ti-aperture cam-icon"></i>
        <div class="cam-label">Dokumentera ditt lager</div>
        <div class="cam-sub">Fotografera kylskåp, skafferi eller råvaror<br>— AI analyserar och föreslår recept</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleImage(event)">
      <img id="previewImg" class="preview-img" alt="Råvaror">
      <button class="retake-btn" id="retakeBtn" onclick="retake()"><i class="ti ti-refresh"></i> &nbsp;Ny exponering</button>
      <div class="status-bar" id="statusBar"><span class="spinner" id="statusSpinner"></span><span id="statusText">Analyserar råvaror...</span></div>
      <div class="ing-wrap" id="ingWrap">
        <div class="section-label">Identifierade råvaror</div>
        <div class="ing-tags" id="ingTags"></div>
        <div class="ing-add">
          <input type="text" id="ingInput" placeholder="Tillsätt manuellt..." onkeydown="if(event.key==='Enter'){addIngredient();this.blur()}">
          <button onclick="addIngredient()">+ Lägg till</button>
        </div>
      </div>
      <button class="btn-main" id="findBtn" onclick="findRecipes()"><i class="ti ti-wand"></i>&nbsp;&nbsp;Komponera recept</button>
    </div>

    <!-- AI RESULTS -->
    <div class="pane" id="pane-recipes"><div id="recipesContainer"><div class="empty-state"><i class="ti ti-scan"></i><p>Dokumentera ditt lager<br>för att se vad som är möjligt.</p></div></div></div>

    <!-- RÉPERTOIRE -->
    <div class="pane" id="pane-saved"><div id="savedContainer"></div></div>

    <!-- INSPIRATION -->
    <div class="pane" id="pane-insp">
      <div class="section-label" style="margin-bottom:16px">Ikoniska världsrätter</div>
      <div class="insp-grid" id="inspGrid"></div>
    </div>

  </div>
  <div class="bottom-safe"></div>
</div>

<!-- RECIPE OVERLAY -->
<div class="overlay" id="recipeOverlay">
  <div class="overlay-header">
    <button class="overlay-back" onclick="closeOverlay()"><i class="ti ti-arrow-left"></i></button>
    <div class="overlay-title" id="overlayTitle"></div>
  </div>
  <div class="overlay-body" id="overlayBody"></div>
</div>

<script>
// ── INSPIRATION DATA ──────────────────────────────────────────
const INSPIRATION = [
  {name:"Beef Wellington",origin:"England",flag:"🇬🇧",diff:3,tags:["Oxfilé","Duxelles","Smördeg"],desc:"Oxfilé insvept i svampduxelles och smördeg — Gordon Ramsays signaturrätt."},
  {name:"Coq au Vin",origin:"Frankrike",flag:"🇫🇷",diff:2,tags:["Kyckling","Bourgogne","Lardons"],desc:"Klassisk fransk kyckling bräserad i rödvin med bacon, champinjoner och syltlök."},
  {name:"Duck Confit",origin:"Frankrike",flag:"🇫🇷",diff:2,tags:["Anka","Ankfett","Långkok"],desc:"Anklår tillagade länge i eget fett — sprödast möjliga skinn, möraste kött."},
  {name:"Bouillabaisse",origin:"Marseille",flag:"🇫🇷",diff:3,tags:["Saffran","Havsfisk","Rouille"],desc:"Marseilles stora fisksoppa med saffran, rouille och croûtons. Världens mest komplexa soppa."},
  {name:"Risotto al Tartufo",origin:"Italien",flag:"🇮🇹",diff:2,tags:["Tryffel","Arborio","Parmesan"],desc:"Krämig risotto med svart eller vit tryffel — enkelhet som kräver perfektion."},
  {name:"Sole Meunière",origin:"Frankrike",flag:"🇫🇷",diff:1,tags:["Sjötunga","Brynt smör","Citron"],desc:"Julia Childs favoriträtt — sjötunga i brynt smör med citron och persilja."},
  {name:"Crème Brûlée",origin:"Frankrike",flag:"🇫🇷",diff:1,tags:["Vanilj","Grädde","Karamell"],desc:"Silkeslen vaniljkräm under ett knäckande karamelllock. Enkelt. Perfekt."},
  {name:"Tarte Tatin",origin:"Frankrike",flag:"🇫🇷",diff:2,tags:["Äpple","Karamell","Smördeg"],desc:"Det franska misstaget som blev en klassiker — karamelliserade äpplen upp-och-ned."},
  {name:"Osso Buco alla Milanese",origin:"Milano",flag:"🇮🇹",diff:2,tags:["Kalvlägg","Gremolata","Saffransrisotto"],desc:"Bräserade kalvlägg med gremolata — serveras klassiskt med saffransrisotto."},
  {name:"Peking Duck",origin:"Kina",flag:"🇨🇳",diff:3,tags:["Anka","Hoisin","Pannkakor"],desc:"Tre dagars process för den perfekta sprödlackerade skinnet. Kinas mest berömda rätt."},
  {name:"Mole Negro",origin:"Oaxaca",flag:"🇲🇽",diff:3,tags:["Chili","Choklad","30 ingredienser"],desc:"Mexikos mest komplexa sås — mörk choklad, torkade chilis, kryddor. Dagar att tillaga."},
  {name:"Lobster Thermidor",origin:"Paris",flag:"🇫🇷",diff:2,tags:["Hummer","Cognac","Gruyère"],desc:"Hummer flamberad i cognac med krämig mustard-gruyèresås — 1800-talets Paris."},

let ingredients=[],savedRecipes=[],imageBase64=null,currentRecipes=[];
let portionScales={};

function initStorage(){
  try{
    const stored=JSON.parse(localStorage.getItem('lacuisine_v3')||'[]');
    const aiOnly=stored.filter(r=>!r.id.startsWith('pre'));
    savedRecipes=[...PREDEFINED,...aiOnly];
  }catch(e){savedRecipes=[...PREDEFINED];}
  PREDEFINED.forEach(r=>{portionScales[r.id]=r.basePortions;});
}
function persist(){try{localStorage.setItem('lacuisine_v3',JSON.stringify(savedRecipes));}catch(e){}}
initStorage();

function showTab(name){
  ['scan','recipes','saved','insp'].forEach(t=>{
    document.getElementById('pane-'+t).classList.toggle('active',t===name);
    document.getElementById('tab-'+t).classList.toggle('active',t===name);
  });
  if(name==='insp')renderInspiration();
  if(name==='saved')renderSaved();
}

// ── SCAN ──────────────────────────────────────────────────────
function retake(){
  document.getElementById('previewImg').style.display='none';
  document.getElementById('cameraBox').style.display='block';
  document.getElementById('retakeBtn').style.display='none';
  document.getElementById('ingWrap').style.display='none';
  document.getElementById('findBtn').classList.remove('show');
  document.getElementById('statusBar').className='status-bar';
  ingredients=[];imageBase64=null;
  document.getElementById('fileInput').value='';
}
function handleImage(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(ev){
    const dataUrl=ev.target.result;
    imageBase64=dataUrl.split(',')[1];
    const img=document.getElementById('previewImg');
    img.src=dataUrl;img.style.display='block';
    document.getElementById('cameraBox').style.display='none';
    document.getElementById('retakeBtn').style.display='block';
    await analyzeImage();
  };
  reader.readAsDataURL(file);
}
function setStatus(type,text){
  const bar=document.getElementById('statusBar');
  bar.className='status-bar '+type;
  document.getElementById('statusSpinner').style.display=type==='loading'?'inline-block':'none';
  document.getElementById('statusText').textContent=text;
}
async function analyzeImage(){
  setStatus('loading','Analyserar råvaror...');
  document.getElementById('ingWrap').style.display='none';
  document.getElementById('findBtn').classList.remove('show');
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:imageBase64}},
          {type:'text',text:'Lista alla matvaror och ingredienser du ser i bilden. Svara ENBART med en JSON-array av strängar på svenska. Bara JSON.'}
        ]}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'[]';
    try{ingredients=JSON.parse(text.replace(/```json|```/g,'').trim());}catch{ingredients=[];}
    document.getElementById('statusBar').className='status-bar';
    renderIngredients();
    document.getElementById('ingWrap').style.display='block';
    document.getElementById('findBtn').classList.add('show');
  }catch(err){
    setStatus('error','Kunde inte analysera. Kontrollera anslutningen.');
    document.getElementById('ingWrap').style.display='block';
    renderIngredients();
    document.getElementById('findBtn').classList.add('show');
  }
}
function renderIngredients(){
  document.getElementById('ingTags').innerHTML=ingredients.map((ing,i)=>
    `<div class="ing-tag">${ing}<button onclick="removeIng(${i})">×</button></div>`
  ).join('');
}
function removeIng(i){ingredients.splice(i,1);renderIngredients();}
function addIngredient(){
  const input=document.getElementById('ingInput');
  const val=input.value.trim();
  if(val){ingredients.push(val);input.value='';renderIngredients();}
}

// ── AI RECIPES ────────────────────────────────────────────────
async function findRecipes(){
  if(!ingredients.length){alert('Inga råvaror identifierade.');return;}
  showTab('recipes');
  const container=document.getElementById('recipesContainer');
  container.innerHTML='<div class="empty-state"><span class="spinner"></span><p style="margin-top:16px">Komponerar alternativ...</p></div>';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,
        messages:[{role:'user',content:`Du är en stjärnkockens assistent. Råvaror: ${ingredients.join(', ')}. Föreslå 4 ambitiösa recept. Svara ENBART med JSON utan backticks:\n{"recipes":[{"name":"Namn","time":"25 min","portions":"2 pers","match":"hög","steps":["Steg 1","Steg 2","Steg 3"],"missing":["saknad"]}]}`}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'{}';
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    currentRecipes=parsed.recipes||[];
    renderRecipes();
  }catch(err){
    container.innerHTML='<div class="empty-state"><i class="ti ti-alert-circle"></i><p>Förbindelsen bröts.<br>Försök igen.</p></div>';
  }
}
function renderRecipes(){
  const container=document.getElementById('recipesContainer');
  if(!currentRecipes.length){container.innerHTML='<div class="empty-state"><p>Inga resultat.</p></div>';return;}
  container.innerHTML='<div class="recipe-cards">'+currentRecipes.map((r,i)=>`
    <div class="recipe-card" id="rcard-${i}">
      <div class="recipe-card-header" onclick="toggleRecipe(${i})">
        <div style="flex:1"><div class="recipe-name">${r.name}</div><div class="recipe-meta"><span class="recipe-badge"><i class="ti ti-clock"></i>${r.time||'–'}</span><span class="recipe-badge"><i class="ti ti-users"></i>${r.portions||'–'}</span></div></div>
        <span class="match-pill ${r.match==='hög'?'match-high':'match-mid'}">${r.match==='hög'?'✦ Complet':'◦ Partiel'}</span>
      </div>
      <div class="recipe-body" id="rbody-${i}">
        <ol class="recipe-steps">${(r.steps||[]).map(s=>`<li>${s}</li>`).join('')}</ol>
        ${r.missing&&r.missing.length?`<div class="missing-label">Manquant</div><div class="recipe-missing">${r.missing.map(m=>`<span class="missing-tag">${m}</span>`).join('')}</div>`:''}
        <button class="save-btn" id="savebtn-${i}" onclick="saveAIRecipe(${i})"><i class="ti ti-bookmark"></i>&nbsp;&nbsp;Arkivera i répertoire</button>
      </div>
    </div>`).join('')+'</div>';
}
function toggleRecipe(i){document.getElementById('rbody-'+i).classList.toggle('open');}
function saveAIRecipe(i){
  const r=currentRecipes[i];
  if(!savedRecipes.find(s=>s.name===r.name)){
    const newR={id:'ai_'+Date.now(),name:r.name,category:'AI · Scanner',time:r.time,basePortions:2,source:'Komposit '+new Date().toLocaleDateString('sv-SE'),ingredients:[],steps:r.steps||[],notes:r.missing&&r.missing.length?'Saknades: '+r.missing.join(', '):''};
    savedRecipes.push(newR);persist();portionScales[newR.id]=2;
  }
  const btn=document.getElementById('savebtn-'+i);btn.className='save-btn saved';btn.innerHTML='<i class="ti ti-check"></i>&nbsp;&nbsp;Arkiverat';
}

// ── RÉPERTOIRE ────────────────────────────────────────────────
function fmtQty(qty,scale,base){
  const v=qty*scale/base;
  if(v>=100)return Math.round(v).toString();
  if(v>=10)return (Math.round(v*10)/10).toString();
  const fracs=[[1/4,'¼'],[1/3,'⅓'],[1/2,'½'],[2/3,'⅔'],[3/4,'¾']];
  for(const [f,s] of fracs)if(Math.abs(v-f)<0.05)return s;
  return (Math.round(v*100)/100).toString().replace('.',',');
}
function renderIngLine(ing,scale,base){
  if(ing.scalable===false||!ing.qty)return`<div class="detail-ing">${ing.text}</div>`;
  return`<div class="detail-ing"><span class="qty">${fmtQty(ing.qty,scale,base)} ${ing.unit}</span> ${ing.text}</div>`;
}
function renderSaved(){
  const container=document.getElementById('savedContainer');
  if(!savedRecipes.length){container.innerHTML='<div class="empty-state"><i class="ti ti-book"></i><p>Répertoire vide.</p></div>';return;}
  container.innerHTML='<div class="saved-list">'+savedRecipes.map((r,i)=>{
    const scale=portionScales[r.id]||r.basePortions||4;
    return`<div class="saved-item" id="sitem-${i}">
      <div class="saved-item-header" onclick="toggleSaved(${i})">
        <div class="saved-icon-wrap"><i class="ti ${r.id.startsWith('ai')?'ti-wand':'ti-bookmark-filled'}"></i></div>
        <div style="flex:1"><div class="saved-name">${r.name}</div><div class="saved-meta-row"><span>${r.category||''}</span><span class="saved-meta-dot">·</span><span>${r.time||''}</span></div></div>
        ${r.id.startsWith('ai')?`<button class="saved-del" onclick="deleteSaved(event,${i})"><i class="ti ti-x"></i></button>`:''}
      </div>
      <div class="saved-detail" id="sdetail-${i}">
        <span class="cat-pill">${r.source||''}</span>
        <div class="scaler"><span class="scaler-label">Portioner</span><button class="scaler-btn" onclick="changePortions('${r.id}',${i},-1)">−</button><span class="scaler-val" id="scaler-val-${r.id}">${scale}</span><span class="scaler-unit">pers</span><button class="scaler-btn" onclick="changePortions('${r.id}',${i},1)">+</button></div>
        ${r.ingredients&&r.ingredients.filter(x=>x&&x.text).length?`<div class="detail-section"><div class="detail-label">Mise en place</div><div id="ing-list-${r.id}">${r.ingredients.filter(x=>x&&x.text).map(ing=>renderIngLine(ing,scale,r.basePortions||4)).join('')}</div></div>`:''}
        ${r.steps&&r.steps.length?`<div class="detail-section"><div class="detail-label">Méthode</div>${r.steps.map((s,si)=>`<div class="detail-step"><span class="detail-step-num">${si+1}</span>${s}</div>`).join('')}</div>`:''}
        ${r.notes?`<div class="detail-section"><div class="detail-label">Notes</div><div class="detail-notes">${r.notes}</div></div>`:''}
      </div>
    </div>`;
  }).join('')+'</div>';
}
function toggleSaved(i){
  const d=document.getElementById('sdetail-'+i);
  const it=document.getElementById('sitem-'+i);
  const open=d.classList.toggle('open');
  it.classList.toggle('open-item',open);
}
function changePortions(id,idx,delta){
  const r=savedRecipes.find(x=>x.id===id);if(!r)return;
  portionScales[id]=Math.min(50,Math.max(1,(portionScales[id]||r.basePortions)+delta));
  const scale=portionScales[id];
  const valEl=document.getElementById('scaler-val-'+id);if(valEl)valEl.textContent=scale;
  const ingListEl=document.getElementById('ing-list-'+id);
  if(ingListEl&&r.ingredients)ingListEl.innerHTML=r.ingredients.filter(x=>x&&x.text).map(ing=>renderIngLine(ing,scale,r.basePortions||4)).join('');
}
function deleteSaved(e,i){
  e.stopPropagation();
  if(savedRecipes[i].id.startsWith('pre'))return;
  if(confirm('Radera '+savedRecipes[i].name+'?')){savedRecipes.splice(i,1);persist();renderSaved();}
}

// ── INSPIRATION ───────────────────────────────────────────────
function renderInspiration(){
  const grid=document.getElementById('inspGrid');
  const diffLabel=['','★','★★','★★★'];
  const diffClass=['','diff-1','diff-2','diff-3'];
  grid.innerHTML=INSPIRATION.map((d,i)=>`
    <div class="insp-card" onclick="openInspiration(${i})">
      <span class="insp-diff ${diffClass[d.diff]}">${diffLabel[d.diff]}</span>
      <span class="insp-flag">${d.flag}</span>
      <div class="insp-name">${d.name}</div>
      <div class="insp-origin">${d.origin}</div>
      <div class="insp-tags">${d.tags.map(t=>`<span class="insp-tag">${t}</span>`).join('')}</div>
    </div>`).join('');
}

async function openInspiration(i){
  const dish=INSPIRATION[i];
  const overlay=document.getElementById('recipeOverlay');
  const body=document.getElementById('overlayBody');
  const title=document.getElementById('overlayTitle');
  title.textContent=dish.name;
  body.innerHTML=`<div class="overlay-loading"><span class="spinner spinner-lg"></span><p>Komponerar receptet...</p></div>`;
  overlay.classList.add('open');

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,
        messages:[{role:'user',content:`Du är en stjärnkock. Ge mig ett komplett, autentiskt och detaljerat recept på "${dish.name}" (${dish.origin}). Svara ENBART med JSON utan backticks:\n{"time":"X tim","portions":"4 pers","intro":"En kort poetisk mening om rätten","ingredients":["600g ingrediens","2 msk annat"],"steps":["Detaljerat steg 1","Steg 2","Steg 3","Steg 4","Steg 5"],"chefnote":"Professionellt kocktips"}`}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'{}';
    const r=JSON.parse(text.replace(/```json|```/g,'').trim());

    body.innerHTML=`
      <div style="margin-bottom:20px">
        <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px">${dish.origin} ${dish.flag}</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;color:var(--muted);line-height:1.6;margin-bottom:16px">${r.intro||dish.desc}</div>
        <div style="display:flex;gap:16px">
          <span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px"><i class="ti ti-clock" style="font-size:13px"></i>${r.time||'–'}</span>
          <span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px"><i class="ti ti-users" style="font-size:13px"></i>${r.portions||'–'}</span>
        </div>
      </div>
      <div style="height:0.5px;background:var(--border);margin-bottom:20px"></div>
      <div style="margin-bottom:20px">
        <div style="font-size:9px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px">Mise en place<span style="flex:1;height:0.5px;background:var(--border)"></span></div>
        ${(r.ingredients||[]).map(ing=>`<div style="font-size:13px;color:var(--cream2);margin-bottom:6px;padding-left:14px;position:relative;line-height:1.5"><span style="position:absolute;left:0;color:var(--gold)">·</span>${ing}</div>`).join('')}
      </div>
      <div style="margin-bottom:20px">
        <div style="font-size:9px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px">Méthode<span style="flex:1;height:0.5px;background:var(--border)"></span></div>
        ${(r.steps||[]).map((s,si)=>`<div style="font-size:13px;color:var(--cream2);margin-bottom:10px;padding-left:26px;position:relative;line-height:1.6"><span style="position:absolute;left:0;font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--gold);font-weight:600">${si+1}</span>${s}</div>`).join('')}
      </div>
      ${r.chefnote?`<div style="font-size:12px;color:var(--muted);border-left:2px solid var(--gold);padding:10px 14px;line-height:1.6;font-style:italic;background:var(--gold-dim);border-radius:0 4px 4px 0;margin-bottom:20px">${r.chefnote}</div>`:''}
      <button onclick="saveInspirationRecipe(${JSON.stringify({name:dish.name,time:r.time,portions:r.portions,ingredients:r.ingredients,steps:r.steps,notes:r.chefnote,origin:dish.origin}).replace(/"/g,'&quot;')})" style="width:100%;padding:13px;background:transparent;color:var(--gold);border:0.5px solid var(--border2);border-radius:4px;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px" id="inspSaveBtn">
        <i class="ti ti-bookmark"></i>&nbsp;&nbsp;Spara i répertoire
      </button>`;
  }catch(err){
    body.innerHTML='<div class="overlay-loading"><i class="ti ti-alert-circle" style="font-size:36px;color:var(--border2)"></i><p>Kunde inte hämta receptet.<br>Försök igen.</p></div>';
  }
}

function saveInspirationRecipe(r){
  if(!savedRecipes.find(s=>s.name===r.name)){
    const newR={id:'insp_'+Date.now(),name:r.name,category:r.origin+' · Inspiration',time:r.time,basePortions:4,source:r.origin,
      ingredients:(r.ingredients||[]).map(t=>({scalable:false,text:t})),
      steps:r.steps||[],notes:r.notes||''};
    savedRecipes.push(newR);persist();portionScales[newR.id]=4;
  }
  const btn=document.getElementById('inspSaveBtn');
  if(btn){btn.style.background='var(--green-bg)';btn.style.color='#6dbf9c';btn.innerHTML='<i class="ti ti-check"></i>&nbsp;&nbsp;Sparat i répertoire';}
}

function closeOverlay(){
  document.getElementById('recipeOverlay').classList.remove('open');
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
